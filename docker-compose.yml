# =============================================================================
# AI Project Management SaaS — Docker Compose baseline (Story 1.2)
# =============================================================================
# Local stack: postgres 16, redis 7, backend :4000, frontend :3000.
# Backend: Express API (Story 1.3). Frontend remains a placeholder until Story 1.4.
# =============================================================================

services:
  postgres:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: apm
      POSTGRES_PASSWORD: apm
      POSTGRES_DB: apm
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apm -d apm']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      PORT: '4000'
      DATABASE_URL: postgresql://apm:apm@postgres:5432/apm
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: change-me-access
      COOKIE_SECURE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://apm:apm@postgres:5432/apm
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
